name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (race + cover)
        run: go test ./... -race -cover
      - name: Golden files up to date (no -update)
        run: go test . -run TestGolden
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - name: Short fuzz
        run: go test ./internal/algorithms/ -run=xxx -fuzz=FuzzMyersInvariants -fuzztime=30s

  nightly-fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Long fuzz
        run: go test ./internal/algorithms/ -run=xxx -fuzz=FuzzMyersInvariants -fuzztime=15m
